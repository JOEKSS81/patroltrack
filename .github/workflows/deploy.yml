# Desplegament automàtic a Cloudflare cada cop que hi ha canvis a main.
# Substitueix ./deploy-all.sh (no cal el Mac).
# Requereix un sol secret al repo: CLOUDFLARE_API_TOKEN
#   (GitHub → Settings → Secrets and variables → Actions → New repository secret)
name: Deploy a Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # botó "Run workflow" per llançar-ho a mà

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 7d54844ed3dce322f276a553e42eb48d   # no és secret (ja és a .wrangler/cache)
  VITE_API_URL: https://patroltrack-api.patroltrack.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprova el secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Instal·la dependències
        run: |
          npm ci --prefix cloudflare
          npm ci --prefix frontend

      - name: Desplega l'API (Worker)
        working-directory: cloudflare
        run: npx wrangler deploy

      - name: Compila el frontend
        working-directory: frontend
        run: npm run build

      - name: Desplega el frontend (Pages)
        working-directory: cloudflare
        run: npx wrangler pages deploy ../frontend/dist --project-name patroltrack --branch main --commit-dirty=true
