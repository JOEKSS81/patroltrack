# Desplegament automàtic a Cloudflare cada cop que hi ha canvis a main.
# Substitueix ./deploy-all.sh (no cal el Mac).
# Requereix un sol secret al repo: CLOUDFLARE_API_TOKEN
#   (GitHub → Settings → Secrets and variables → Actions → New repository secret)
name: Deploy a Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # botó "Run workflow" per llançar-ho a mà

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 7d54844ed3dce322f276a553e42eb48d   # no és secret (ja és a .wrangler/cache)
  VITE_API_URL: https://patroltrack-api.patroltrack.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprova el secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Instal·la dependències
        run: |
          npm ci --prefix cloudflare
          npm ci --prefix frontend

      - name: Aplica l'esquema de la base de dades (idempotent)
        working-directory: cloudflare
        run: npx wrangler d1 execute patroltrack --remote --file=schema.sql

      - name: Desplega l'API (Worker)
        working-directory: cloudflare
        run: npx wrangler deploy

      # Les claus del Worker es guarden com a secrets de GitHub i es tornen a posar a
      # cada desplegament: si el Worker es recrea, no es perden.
      #  - INGEST_TOKEN: el mateix token de Config a l'app
      #  - TELEGRAM_BOT_TOKEN: el de @BotFather
      #  El secret del webhook es deriva del token del bot (no cal guardar-lo).
      - name: Sincronitza les claus del Worker
        working-directory: cloudflare
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$INGEST_TOKEN" ]; then
            printf '%s' "$INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN
          else
            echo "::warning::Falta el secret INGEST_TOKEN: el botó de reportar i MacroDroid no funcionaran"
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
            WEBHOOK_SECRET=$(printf 'patroltrack-webhook:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
            printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
          else
            echo "::warning::Falta el secret TELEGRAM_BOT_TOKEN: el bot de Telegram no funcionarà"
          fi

      - name: Torna a registrar el webhook de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Sense bot: s'omet"; exit 0; fi
          sleep 5
          curl -sS -X POST "$VITE_API_URL/api/telegram-setup" | head -c 400; echo

      - name: Compila el frontend
        working-directory: frontend
        run: npm run build

      - name: Desplega el frontend (Pages)
        working-directory: cloudflare
        run: npx wrangler pages deploy ../frontend/dist --project-name patroltrack --branch main --commit-dirty=true
